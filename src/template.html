<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App - Enhanced</title>
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar - Projects -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>📋 Projects</h2>
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme">🌙</button>
      </div>
      
      <div id="project-list" class="project-list"></div>
      
      <button id="add-project-btn" class="btn-primary btn-block">+ New Project</button>
      
      <div class="sidebar-footer">
        <button id="export-btn" class="btn-secondary btn-sm" title="Export todos">📤 Export</button>
        <button id="import-btn" class="btn-secondary btn-sm" title="Import todos">📥 Import</button>
      </div>
    </aside>
    
    <!-- Main Content - Todos -->
    <main class="main-content">
      <header class="main-header">
        <div>
          <h1 id="project-title">My Tasks</h1>
          <p class="subtitle">Stay organized and productive</p>
        </div>
        <button id="add-todo-btn" class="btn-primary">+ Add Todo</button>
      </header>
      
      <!-- Search and Filters -->
      <div class="filters-section">
        <div class="search-box">
          <input 
            type="text" 
            id="search-input" 
            placeholder="🔍 Search todos..." 
            class="search-input"
          >
        </div>
        
        <div class="filter-controls">
          <select id="filter-priority" class="filter-select">
            <option value="all">All Priorities</option>
            <option value="high">High Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="low">Low Priority</option>
          </select>
          
          <button id="clear-filters-btn" class="btn-secondary btn-sm">Clear Filters</button>
        </div>
      </div>
      
      <!-- Tag Filters -->
      <div class="tags-filter-section">
        <label class="tags-label">Filter by tags:</label>
        <div id="tag-filters" class="tag-filters"></div>
      </div>
      
      <!-- Todo List -->
      <div id="todo-list" class="todo-list"></div>
    </main>
  </div>
  
  <!-- New Todo Modal -->
  <div id="new-todo-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Todo</h2>
        <button class="close-btn" onclick="this.closest('.modal').classList.remove('active')">×</button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label for="todo-title">Title *</label>
          <input type="text" id="todo-title" class="form-input" placeholder="What needs to be done?" required>
        </div>
        
        <div class="form-group">
          <label for="todo-description">Description</label>
          <textarea id="todo-description" class="form-textarea" rows="3" placeholder="Add more details..."></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="todo-due-date">Due Date *</label>
            <input type="date" id="todo-due-date" class="form-input" required>
          </div>
          
          <div class="form-group">
            <label for="todo-priority">Priority</label>
            <select id="todo-priority" class="form-select">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        
        <div class="form-group">
          <label for="todo-tags">Tags (comma-separated)</label>
          <input type="text" id="todo-tags" class="form-input" placeholder="work, personal, urgent">
        </div>
        
        <div class="form-group">
          <label for="todo-notes">Notes</label>
          <textarea id="todo-notes" class="form-textarea" rows="2" placeholder="Additional notes..."></textarea>
        </div>
      </div>
      
      <div class="modal-footer">
        <button id="cancel-todo-btn" class="btn-secondary">Cancel</button>
        <button id="save-todo-btn" class="btn-primary">Save Todo</button>
      </div>
    </div>
  </div>
  
  <!-- Edit Todo Modal -->
  <div id="edit-todo-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Todo</h2>
        <button class="close-btn" onclick="this.closest('.modal').classList.remove('active')">×</button>
      </div>
      
      <div class="modal-body">
        <input type="hidden" id="edit-todo-id">
        
        <div class="form-group">
          <label for="edit-todo-title">Title *</label>
          <input type="text" id="edit-todo-title" class="form-input" required>
        </div>
        
        <div class="form-group">
          <label for="edit-todo-description">Description</label>
          <textarea id="edit-todo-description" class="form-textarea" rows="3"></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="edit-todo-due-date">Due Date *</label>
            <input type="date" id="edit-todo-due-date" class="form-input" required>
          </div>
          
          <div class="form-group">
            <label for="edit-todo-priority">Priority</label>
            <select id="edit-todo-priority" class="form-select">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        
        <div class="form-group">
          <label for="edit-todo-tags">Tags (comma-separated)</label>
          <input type="text" id="edit-todo-tags" class="form-input">
        </div>
        
        <div class="form-group">
          <label for="edit-todo-notes">Notes</label>
          <textarea id="edit-todo-notes" class="form-textarea" rows="2"></textarea>
        </div>
      </div>
      
      <div class="modal-footer">
        <button id="cancel-edit-btn" class="btn-secondary">Cancel</button>
        <button id="save-edit-btn" class="btn-primary">Save Changes</button>
      </div>
    </div>
  </div>
  
</body>
</html>
